name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Build
        run: gradle assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log; test ${PIPESTATUS[0]} -eq 0
        shell: bash

      - name: Save build log on failure
        if: failure()
        run: |
          git config user.name ci && git config user.email ci@example.com
          git checkout --orphan ci-log
          git rm -rq --cached . || true
          grep -E "^e: |error:|FAILED|What went wrong" -A3 build.log > errors.txt || true
          git add -f build.log errors.txt
          git commit -qm "build log ${{ github.run_number }}"
          git push -f origin ci-log

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk Spark.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Spark-apk
          path: Spark.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Spark build ${{ github.run_number }}
          files: Spark.apk
